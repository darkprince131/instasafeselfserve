# InstaSafe i365 self-serve trial.
#
# Project root IS the app, so there is no `base`. The console-redesign repo
# needed one because the app lived in a subfolder; that cost two failed
# deploys when a second netlify.toml won. Keep exactly one of these, here.

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  # Vite 7 requires ^20.19.0 || >=22.12.0. A bare "20" resolves to whatever
  # Netlify's newest 20.x image happens to be, which is not guaranteed to
  # clear 20.19 - so pin 22 and leave no room for it.
  NODE_VERSION = "22"

# Vue Router runs in history mode, so every path has to serve the app shell
# rather than 404. This must stay last among redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite fingerprints every filename, so these can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The production stylesheets are byte-identical copies of what veno serves.
# They never change without a deliberate re-capture, so cache them hard too.
[[headers]]
  for = "/prod/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
